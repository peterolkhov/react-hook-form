name: state42 resetField rejection ownership repair

on:
  workflow_dispatch:
  push:
    branches: [codex/verify-resetfield-repair75]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [original, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reconstruct sealed repair75 packet part 1 of 5
        run: |
          printf '%s' '' > "$RUNNER_TEMP/repair75-packet.b64"
      - name: Reconstruct sealed repair75 packet part 2 of 5
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair75-packet.b64"
      - name: Reconstruct sealed repair75 packet part 3 of 5
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair75-packet.b64"
      - name: Reconstruct sealed repair75 packet part 4 of 5
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair75-packet.b64"
      - name: Reconstruct sealed repair75 packet part 5 of 5
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair75-packet.b64"
      - name: Verify and materialize the exact source and diagnostic packet
        run: |
          python3 - <<'PACKET'
          import base64,hashlib,json,os,pathlib,zlib
          compressed=base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'repair75-packet.b64').read_bytes())
          assert hashlib.sha256(compressed).hexdigest()=='b61077ed9d13469a162dd86da739cc30d4fb166c9352a873d4ff5f95581ae4c5'
          payload=zlib.decompress(compressed)
          assert hashlib.sha256(payload).hexdigest()=='0b4b6a4a9e3e41f753735520864321145a825ad695181028ff62ad3620d077a5'
          files=json.loads(payload)
          assert set(files)==set(['assess-native.mjs', 'assess-ownership.mjs', 'assess-parent-pending.mjs', 'assess-regressions.mjs', 'assess-rejections.mjs', 'assess-review65.mjs', 'assess-supersession.mjs', 'lint-evidence.mjs', 'native-resetfield.test.tsx', 'parent-pending.test.tsx', 'rejected-recovery.test.tsx', 'run-groups.mjs', 'source-files/src/__tests__/useForm/resetField.async.test.tsx', 'source-files/src/__tests__/useForm/resetField.asyncOwnership.test.tsx', 'source-files/src/__tests__/useForm/resetField.asyncRejection.test.tsx', 'source-files/src/__tests__/useForm/resetField.asyncSupersession.test.tsx', 'source-files/src/logic/createFormControl.ts', 'source-files/src/logic/validateField.ts', 'source-files/src/useFieldArray.ts', 'source-guard.mjs', 'source-manifest.json'])
          root=pathlib.Path('packet')
          for name,data in files.items():
              destination=root/name
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(base64.b64decode(data))
          print('SEALED_REPAIR68_PACKET=PASS; files='+str(len(files)))
          PACKET
      - name: Check out complete official project at the original pin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: react-hook-form/react-hook-form
          ref: 6864846a29076d83d9d15c0925d0e71d9046d020
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Guard clean baseline HEAD tree index and all tracked source
        working-directory: upstream
        run: |
          node ../packet/source-guard.mjs baseline ${{ matrix.mode }} "$RUNNER_TEMP/repair75"
          node --version
          pnpm --version
      - name: Install official dependencies from the unchanged frozen lockfile
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Capture exact clean-source ESLint warning identities
        working-directory: upstream
        run: |
          set +e
          pnpm lint --format json > "$RUNNER_TEMP/repair75/lint-baseline.raw" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/repair75/lint-baseline.exit"
          node ../packet/lint-evidence.mjs "$RUNNER_TEMP/repair75" baseline
      - name: Guard original bytes and install only the declared candidate and frozen tests
        working-directory: upstream
        run: node ../packet/source-guard.mjs before ${{ matrix.mode }} "$RUNNER_TEMP/repair75"
      - name: Preserve the original resolver batching suite baseline
        if: matrix.mode == 'original'
        working-directory: upstream
        run: pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/resolver.test.tsx
      - name: Run public6 permanent23 parent2 ownership11 rejection4 supersession6 and immutable review65 four cases
        working-directory: upstream
        run: node ../packet/run-groups.mjs "$RUNNER_TEMP/repair75" ${{ matrix.mode }}
      - name: Run existing async reset trigger registration retention batching subscription array and submit suites
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/reset.test.tsx src/__tests__/useForm/resetField.test.tsx src/__tests__/useForm/trigger.test.tsx src/__tests__/useForm/register.test.tsx src/__tests__/useForm/unregister.test.tsx src/__tests__/useForm/handleSubmit.test.tsx src/__tests__/useForm/formState.test.tsx src/__tests__/useForm/subscribe.test.tsx src/__tests__/useForm/resolver.test.tsx src/__tests__/useFieldArray.test.tsx
      - name: Run the entire candidate native Jest suite
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm test --ci --runInBand
      - name: Check production and test types
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: |
          pnpm type
          pnpm test:type
      - name: Check native lint and compare full warning identities to the clean baseline
        working-directory: upstream
        run: |
          set +e
          pnpm lint --format json > "$RUNNER_TEMP/repair75/lint-candidate.raw" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/repair75/lint-candidate.exit"
          node ../packet/lint-evidence.mjs "$RUNNER_TEMP/repair75" candidate
      - name: Check builds and public API reports
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: |
          pnpm build
          pnpm api-extractor
          pnpm build:esm
          pnpm api-extractor:ci
      - name: Install official Chromium runtime
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm exec playwright install --with-deps chromium
      - name: Run official Chromium E2E with its configured web server
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm e2e --workers=2
      - name: Guard exact HEAD index tracked source permanent files and frozen bytes after all checks
        if: always()
        working-directory: upstream
        run: node ../packet/source-guard.mjs after ${{ matrix.mode }} "$RUNNER_TEMP/repair75"
      - name: Preserve all native raw JSON merged logs receipts statuses lint identities and guards
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state42-repair75-${{ matrix.mode }}
          path: ${{ runner.temp }}/repair75
          if-no-files-found: error

name: state42 resetField repair validation

on:
  push:
    branches: [codex/validate-resetfield-stale-validation]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [original, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Exact sealed packet part 1
        run: printf '%s' '' > "$RUNNER_TEMP/state42-packet.b64"
      - name: Exact sealed packet part 2
        run: printf '%s' '' >> "$RUNNER_TEMP/state42-packet.b64"
      - name: Exact sealed packet part 3
        run: printf '%s' '' >> "$RUNNER_TEMP/state42-packet.b64"
      - name: Exact sealed packet part 4
        run: printf '%s' '' >> "$RUNNER_TEMP/state42-packet.b64"
      - name: Reconstruct exact sealed source and test packet
        run: |
          python3 - <<'PACKET'
          import base64,hashlib,json,os,pathlib,zlib
          payload=zlib.decompress(base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'state42-packet.b64').read_bytes()))
          assert hashlib.sha256(payload).hexdigest()=='536e9593fbdb20fae6bbd3720a42796328d90f5a6cdd3b33c62a85633ffa5680'
          files=json.loads(payload)
          assert set(files)=={'source-files/src/useFieldArray.ts', 'assess-regressions.mjs', 'native-resetfield.test.tsx', 'source-manifest.json', 'source-files/src/__tests__/useForm/resetField.async.test.tsx', 'source-guard.mjs', 'source-files/src/logic/createFormControl.ts', 'assess-native.mjs', 'source-files/src/logic/validateField.ts'}
          root=pathlib.Path('packet/.state42-fix')
          for name,data in files.items():
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(base64.b64decode(data))
          print('EXACT_SEALED_STATE42_PACKET=PASS')
          PACKET
      - name: Check out complete pinned upstream
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: react-hook-form/react-hook-form
          ref: 6864846a29076d83d9d15c0925d0e71d9046d020
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Verify source and install exact candidate or original
        working-directory: upstream
        run: |
          node ../packet/.state42-fix/source-guard.mjs before ${{ matrix.mode }} "$RUNNER_TEMP/state42"
          node --version
          pnpm --version
      - name: Install official locked dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Run unchanged six-case public reproduction
        working-directory: upstream
        run: |
          set +e
          pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/state42-resetField.test.tsx --json --outputFile="$RUNNER_TEMP/state42/jest-results.json" > "$RUNNER_TEMP/state42/native.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/state42/test-exit-code.txt"
          cat "$RUNNER_TEMP/state42/native.log"
          mode=before
          if [ '${{ matrix.mode }}' = candidate ]; then mode=after; fi
          node ../packet/.state42-fix/assess-native.mjs "$RUNNER_TEMP/state42" "$mode"
          cat "$RUNNER_TEMP/state42/jest-results.json"
          cat "$RUNNER_TEMP/state42/rendered-receipts.json"
          mv src/__tests__/useForm/state42-resetField.test.tsx "$RUNNER_TEMP/state42/frozen-fixture.tsx"
      - name: Run permanent native regression tests against original and candidate
        working-directory: upstream
        run: |
          set +e
          pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/resetField.async.test.tsx --json --outputFile="$RUNNER_TEMP/state42/regression-results.json" > "$RUNNER_TEMP/state42/regression.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/state42/regression-exit-code.txt"
          cat "$RUNNER_TEMP/state42/regression.log"
          node ../packet/.state42-fix/assess-regressions.mjs "$RUNNER_TEMP/state42" ${{ matrix.mode }}
          cat "$RUNNER_TEMP/state42/regression-assessment.json"
      - name: Run scoped existing async, reset, trigger, registration, subscription and submit suites
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/reset.test.tsx src/__tests__/useForm/resetField.test.tsx src/__tests__/useForm/trigger.test.tsx src/__tests__/useForm/register.test.tsx src/__tests__/useForm/handleSubmit.test.tsx src/__tests__/useForm/formState.test.tsx src/__tests__/useForm/subscribe.test.tsx src/__tests__/useFieldArray.test.tsx
      - name: Run full native suite
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm test --ci --runInBand
      - name: Check production and test types
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: |
          pnpm type
          pnpm test:type
      - name: Check lint
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm lint
      - name: Check build and public API reports
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: |
          pnpm build
          pnpm api-extractor
          pnpm build:esm
          pnpm api-extractor:ci
      - name: Install official Chromium runtime
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm exec playwright install --with-deps chromium
      - name: Run official Chromium E2E suite and configured web server
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm e2e --workers=2
      - name: Verify exact source, permanent tests and frozen reproduction after all checks
        if: always()
        working-directory: upstream
        run: node ../packet/.state42-fix/source-guard.mjs after ${{ matrix.mode }} "$RUNNER_TEMP/state42"

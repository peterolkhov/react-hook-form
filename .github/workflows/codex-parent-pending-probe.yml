name: state42 parent pending public comparison

on:
  push:
    branches: [codex/probe-resetfield-parent-pending]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [original, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Exact sealed packet part 1
        run: printf '%s' '' > "$RUNNER_TEMP/state42-packet.b64"
      - name: Exact sealed packet part 2
        run: printf '%s' '' >> "$RUNNER_TEMP/state42-packet.b64"
      - name: Exact sealed packet part 3
        run: printf '%s' '' >> "$RUNNER_TEMP/state42-packet.b64"
      - name: Exact sealed packet part 4
        run: printf '%s' '' >> "$RUNNER_TEMP/state42-packet.b64"
      - name: Reconstruct exact sealed source and test packet
        run: |
          python3 - <<'PACKET'
          import base64,hashlib,json,os,pathlib,zlib
          payload=zlib.decompress(base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'state42-packet.b64').read_bytes()))
          assert hashlib.sha256(payload).hexdigest()=='149c5579e79d20ec54651f63104966862267c4a69244aa045ed380f8531677a1'
          files=json.loads(payload)
          assert set(files)=={'source-files/src/useFieldArray.ts', 'assess-regressions.mjs', 'native-resetfield.test.tsx', 'source-manifest.json', 'source-files/src/__tests__/useForm/resetField.async.test.tsx', 'source-guard.mjs', 'source-files/src/logic/createFormControl.ts', 'assess-native.mjs', 'source-files/src/logic/validateField.ts'}
          root=pathlib.Path('packet/.state42-fix')
          for name,data in files.items():
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(base64.b64decode(data))
          print('EXACT_SEALED_STATE42_PACKET=PASS')
          PACKET
      - name: Check out complete pinned upstream
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: react-hook-form/react-hook-form
          ref: 6864846a29076d83d9d15c0925d0e71d9046d020
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Verify source and install exact candidate or original
        working-directory: upstream
        run: |
          node ../packet/.state42-fix/source-guard.mjs before ${{ matrix.mode }} "$RUNNER_TEMP/state42"
          node --version
          pnpm --version
      - name: Install official locked dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Reconstruct exact additional public probe packet
        run: |
          printf '%s' '' > "$RUNNER_TEMP/state42-parent-probe.b64"
          python3 - <<'PROBE'
          import base64,hashlib,json,os,pathlib,zlib
          payload=zlib.decompress(base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'state42-parent-probe.b64').read_bytes()))
          assert hashlib.sha256(payload).hexdigest()=='00235c4a4820ba7744cd5148269fd6aa446728888b26bd44a046332ce06e7487'
          files=json.loads(payload)
          assert set(files)=={'parent-pending.test.tsx','assess-parent-pending.mjs','manifest.json'}
          root=pathlib.Path('packet/.scope-probe')
          for name,data in files.items():
              target=root/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(base64.b64decode(data))
          print('EXACT_PARENT_PENDING_PROBE_PACKET=PASS')
          PROBE
      - name: Verify exact successful candidate and copy only the public probe
        working-directory: upstream
        run: |
          python3 - <<'PROBE'
          import hashlib,json,pathlib,subprocess
          packet=pathlib.Path('../packet/.scope-probe')
          manifest=json.loads((packet/'manifest.json').read_text())
          assert manifest['base_pin']=='6864846a29076d83d9d15c0925d0e71d9046d020'
          assert manifest['successful_candidate_commit']=='a53781bd46f8b548363b3d88e8ade23c3a572b5f'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==manifest['base_pin']
          for entry in manifest['candidate_source_files']:
              source=pathlib.Path(entry['path'])
              expected=entry['after_sha256'] if '${{ matrix.mode }}'=='candidate' or entry['original_sha256'] is None else entry['original_sha256']
              assert hashlib.sha256(source.read_bytes()).hexdigest()==expected,entry['path']
          for name,expected in manifest['probe_files'].items():
              assert hashlib.sha256((packet/name).read_bytes()).hexdigest()==expected,name
          destination=pathlib.Path(manifest['probe_target'])
          assert not destination.exists()
          destination.write_bytes((packet/'parent-pending.test.tsx').read_bytes())
          assert hashlib.sha256(destination.read_bytes()).hexdigest()==manifest['probe_files']['parent-pending.test.tsx']
          print('PARENT_PROBE_EXACT_SOURCE_AND_FIXTURE=PASS')
          PROBE
      - name: Run two finite public React cases through official Jest
        working-directory: upstream
        run: |
          set +e
          pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/state42-parent-pending.test.tsx --json --outputFile="$RUNNER_TEMP/state42/parent-pending-results.json" > "$RUNNER_TEMP/state42/parent-pending.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/state42/parent-pending-exit.txt"
          cat "$RUNNER_TEMP/state42/parent-pending.log"
          cat "$RUNNER_TEMP/state42/parent-pending-results.json"
          node ../packet/.scope-probe/assess-parent-pending.mjs "$RUNNER_TEMP/state42" ${{ matrix.mode }}
          cat "$RUNNER_TEMP/state42/parent-pending-assessment.json"
      - name: Verify complete source and all fixtures before removing only the owned probe
        if: always()
        working-directory: upstream
        run: |
          source_result=0
          node ../packet/.state42-fix/source-guard.mjs after ${{ matrix.mode }} "$RUNNER_TEMP/state42" || source_result=$?
          python3 - <<'PROBE'
          import hashlib,json,pathlib
          packet=pathlib.Path('../packet/.scope-probe')
          manifest=json.loads((packet/'manifest.json').read_text())
          for name,expected in manifest['probe_files'].items():
              assert hashlib.sha256((packet/name).read_bytes()).hexdigest()==expected,name
          destination=pathlib.Path(manifest['probe_target'])
          assert hashlib.sha256(destination.read_bytes()).hexdigest()==manifest['probe_files']['parent-pending.test.tsx']
          destination.unlink()
          print('PARENT_PROBE_FINAL_HASH_AND_OWNED_CLEANUP=PASS')
          PROBE
          exit "$source_result"

name: state42 empty resolver scope observation

on:
  workflow_dispatch:
  push:
    branches: [codex/observe-empty-resolver-takeover]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [original, repair68, repair75]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reconstruct sealed observation part 1 of 7
        run: |
          printf '%s' '' > "$RUNNER_TEMP/review78-packet.b64"
      - name: Reconstruct sealed observation part 2 of 7
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review78-packet.b64"
      - name: Reconstruct sealed observation part 3 of 7
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review78-packet.b64"
      - name: Reconstruct sealed observation part 4 of 7
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review78-packet.b64"
      - name: Reconstruct sealed observation part 5 of 7
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review78-packet.b64"
      - name: Reconstruct sealed observation part 6 of 7
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review78-packet.b64"
      - name: Reconstruct sealed observation part 7 of 7
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review78-packet.b64"
      - name: Verify and materialize the exact source and immutable probe
        run: |
          python3 - <<'PACKET'
          import base64,hashlib,json,os,pathlib,zlib
          compressed=base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'review78-packet.b64').read_bytes())
          assert hashlib.sha256(compressed).hexdigest()=='73d8389e1210c21b54cd32af4d398930963720039c09041a69e00ddc6f5495bb'
          payload=zlib.decompress(compressed)
          assert hashlib.sha256(payload).hexdigest()=='bd0993331fb0d4f985d1a99ac1fc760ede222e0432525797f5abe53ab4cdb4e9'
          files=json.loads(payload)
          assert set(files)==set(['assess.mjs', 'empty-scope-takeover.test.tsx', 'guard.mjs', 'manifest.json', 'mode-files/repair68/src/__tests__/useForm/resetField.async.test.tsx', 'mode-files/repair68/src/__tests__/useForm/resetField.asyncOwnership.test.tsx', 'mode-files/repair68/src/__tests__/useForm/resetField.asyncRejection.test.tsx', 'mode-files/repair68/src/logic/createFormControl.ts', 'mode-files/repair68/src/logic/validateField.ts', 'mode-files/repair68/src/useFieldArray.ts', 'mode-files/repair75/src/__tests__/useForm/resetField.async.test.tsx', 'mode-files/repair75/src/__tests__/useForm/resetField.asyncOwnership.test.tsx', 'mode-files/repair75/src/__tests__/useForm/resetField.asyncRejection.test.tsx', 'mode-files/repair75/src/__tests__/useForm/resetField.asyncSupersession.test.tsx', 'mode-files/repair75/src/logic/createFormControl.ts', 'mode-files/repair75/src/logic/validateField.ts', 'mode-files/repair75/src/useFieldArray.ts'])
          root=pathlib.Path('packet')
          for name,data in files.items():
              destination=root/name
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(base64.b64decode(data))
          print('SEALED_REVIEW78_PACKET=PASS; files='+str(len(files)))
          PACKET
      - name: Check out the complete pinned official project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: react-hook-form/react-hook-form
          ref: 6864846a29076d83d9d15c0925d0e71d9046d020
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Guard exact HEAD tree index tracked bytes and declared source plus probe
        working-directory: upstream
        run: |
          node ../packet/guard.mjs before ${{ matrix.mode }} "$RUNNER_TEMP/review78"
          cat "$RUNNER_TEMP/review78/guard-before.json"
          node --version
          pnpm --version
      - name: Install official dependencies from the unchanged frozen lockfile
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Run five immutable observations and print raw evidence before outcome-neutral assessment
        working-directory: upstream
        run: |
          set +e
          pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/state42-empty-scope-takeover.test.tsx --json --outputFile="$RUNNER_TEMP/review78/jest-results.json" > "$RUNNER_TEMP/review78/native.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/review78/test-exit.txt"
          cat "$RUNNER_TEMP/review78/native.log"
          cat "$RUNNER_TEMP/review78/test-exit.txt"
          cat "$RUNNER_TEMP/review78/jest-results.json"
          python3 - <<'EVIDENCE'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'review78')
          marker='STATE42_EMPTY_SCOPE_RECEIPT '
          receipts=[]
          for line in (root/'native.log').read_text().splitlines():
              if marker in line:
                  value=line.split(marker,1)[1].strip()
                  if value.startswith('{'): receipts.append(json.loads(value))
          (root/'receipts.json').write_text(json.dumps(receipts,indent=2)+'\n')
          result=json.loads((root/'jest-results.json').read_text())
          status={key:result.get(key) for key in ['success','numTotalTests','numPassedTests','numFailedTests','numRuntimeErrorTestSuites','numPendingTests','numTodoTests','openHandles']}
          status['exitCode']=int((root/'test-exit.txt').read_text())
          status['tests']=[{'title':test['title'],'status':test['status']} for suite in result['testResults'] for test in suite['assertionResults']]
          (root/'native-status.json').write_text(json.dumps(status,indent=2)+'\n')
          EVIDENCE
          cat "$RUNNER_TEMP/review78/receipts.json"
          cat "$RUNNER_TEMP/review78/native-status.json"
          node ../packet/assess.mjs "$RUNNER_TEMP/review78" ${{ matrix.mode }}
      - name: Guard exact source and print complete final guard even when observations fail
        if: always()
        working-directory: upstream
        run: |
          node ../packet/guard.mjs after ${{ matrix.mode }} "$RUNNER_TEMP/review78"
          cat "$RUNNER_TEMP/review78/guard-after.json"

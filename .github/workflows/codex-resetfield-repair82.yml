name: state42 deferred validation ownership publication

on:
  workflow_dispatch:
  push:
    branches: [codex/verify-resetfield-repair82]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [original, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Reconstruct sealed repair82 packet part 1 of 6
        run: |
          printf '%s' '' > "$RUNNER_TEMP/repair82-packet.b64"
      - name: Reconstruct sealed repair82 packet part 2 of 6
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair82-packet.b64"
      - name: Reconstruct sealed repair82 packet part 3 of 6
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair82-packet.b64"
      - name: Reconstruct sealed repair82 packet part 4 of 6
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair82-packet.b64"
      - name: Reconstruct sealed repair82 packet part 5 of 6
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair82-packet.b64"
      - name: Reconstruct sealed repair82 packet part 6 of 6
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/repair82-packet.b64"
      - name: Verify and materialize the exact source and diagnostic packet
        run: |
          python3 - <<'PACKET'
          import base64,hashlib,json,os,pathlib,zlib
          compressed=base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'repair82-packet.b64').read_bytes())
          assert hashlib.sha256(compressed).hexdigest()=='aad67106e0e90c04761f2a9bb32d2a6ae0fca73398e1dd42b49e8bb106b892bb'
          payload=zlib.decompress(compressed)
          assert hashlib.sha256(payload).hexdigest()=='8989a3e3b59ca429e8679ff6e1e9d704d66ca30b7a37eaf6a43da843024c5007'
          files=json.loads(payload)
          assert set(files)==set(['assess-empty.mjs', 'assess-native.mjs', 'assess-ownership.mjs', 'assess-parent-pending.mjs', 'assess-regressions.mjs', 'assess-rejections.mjs', 'assess-review65.mjs', 'assess-review78.mjs', 'assess-supersession.mjs', 'empty-scope-takeover.test.tsx', 'lint-evidence.mjs', 'native-resetfield.test.tsx', 'native-suite.mjs', 'parent-pending.test.tsx', 'rejected-recovery.test.tsx', 'run-groups.mjs', 'source-files/src/__tests__/useForm/resetField.async.test.tsx', 'source-files/src/__tests__/useForm/resetField.asyncEmptyScope.test.tsx', 'source-files/src/__tests__/useForm/resetField.asyncOwnership.test.tsx', 'source-files/src/__tests__/useForm/resetField.asyncRejection.test.tsx', 'source-files/src/__tests__/useForm/resetField.asyncSupersession.test.tsx', 'source-files/src/logic/createFormControl.ts', 'source-files/src/logic/validateField.ts', 'source-files/src/useFieldArray.ts', 'source-guard.mjs', 'source-manifest.json'])
          root=pathlib.Path('packet')
          for name,data in files.items():
              destination=root/name
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(base64.b64decode(data))
          print('SEALED_REPAIR82_PACKET=PASS; files='+str(len(files)))
          PACKET
      - name: Check out complete official project at the original pin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: react-hook-form/react-hook-form
          ref: 6864846a29076d83d9d15c0925d0e71d9046d020
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Guard clean baseline HEAD tree index and all tracked source
        working-directory: upstream
        run: |
          node ../packet/source-guard.mjs baseline ${{ matrix.mode }} "$RUNNER_TEMP/repair82"
          node --version
          pnpm --version
      - name: Install official dependencies from the unchanged frozen lockfile
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Capture exact clean-source ESLint warning identities
        working-directory: upstream
        run: |
          set +e
          pnpm lint --format json > "$RUNNER_TEMP/repair82/lint-baseline.raw" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/repair82/lint-baseline.exit"
          cat "$RUNNER_TEMP/repair82/lint-baseline.raw"
          cat "$RUNNER_TEMP/repair82/lint-baseline.exit"
          printf 'LINT_BASELINE_ACTUAL_EXIT=%s\n' "$result"
          node ../packet/lint-evidence.mjs "$RUNNER_TEMP/repair82" baseline
      - name: Guard original bytes and install only the declared candidate and frozen tests
        working-directory: upstream
        run: node ../packet/source-guard.mjs before ${{ matrix.mode }} "$RUNNER_TEMP/repair82"
      - name: Preserve the original resolver batching suite baseline
        if: matrix.mode == 'original'
        working-directory: upstream
        run: pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/resolver.test.tsx
      - name: Run all prior focused cases plus empty6 and immutable review78 five cases
        working-directory: upstream
        run: node ../packet/run-groups.mjs "$RUNNER_TEMP/repair82" ${{ matrix.mode }}
      - name: Run existing async reset trigger registration retention batching subscription array and submit suites
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: node ../packet/native-suite.mjs "$RUNNER_TEMP/repair82" scope
      - name: Run the entire candidate native Jest suite
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: node ../packet/native-suite.mjs "$RUNNER_TEMP/repair82" full
      - name: Check production and test types
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: |
          pnpm type
          pnpm test:type
      - name: Check native lint and compare full warning identities to the clean baseline
        working-directory: upstream
        run: |
          set +e
          pnpm lint --format json > "$RUNNER_TEMP/repair82/lint-candidate.raw" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/repair82/lint-candidate.exit"
          cat "$RUNNER_TEMP/repair82/lint-candidate.raw"
          cat "$RUNNER_TEMP/repair82/lint-candidate.exit"
          printf 'LINT_CANDIDATE_ACTUAL_EXIT=%s\n' "$result"
          node ../packet/lint-evidence.mjs "$RUNNER_TEMP/repair82" candidate
      - name: Check builds and public API reports
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: |
          pnpm build
          pnpm api-extractor
          pnpm build:esm
          pnpm api-extractor:ci
      - name: Install official Chromium runtime
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm exec playwright install --with-deps chromium
      - name: Run official Chromium E2E with its configured web server
        if: matrix.mode == 'candidate'
        working-directory: upstream
        run: pnpm e2e --workers=2
      - name: Guard exact HEAD index tracked source permanent files and frozen bytes after all checks
        if: always()
        working-directory: upstream
        run: node ../packet/source-guard.mjs after ${{ matrix.mode }} "$RUNNER_TEMP/repair82"

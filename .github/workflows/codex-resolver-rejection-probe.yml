name: state42 rejection recovery observation

on:
  workflow_dispatch:
  push:
    branches: [codex/probe-resolver-rejection-ownership]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        mode: [original, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reconstruct sealed packet part 1 of 4
        run: |
          printf '%s' '' > "$RUNNER_TEMP/review65-packet.b64"
      - name: Reconstruct sealed packet part 2 of 4
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review65-packet.b64"
      - name: Reconstruct sealed packet part 3 of 4
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review65-packet.b64"
      - name: Reconstruct sealed packet part 4 of 4
        run: |
          printf '%s' '' >> "$RUNNER_TEMP/review65-packet.b64"
      - name: Verify and materialize exact source and immutable probe
        run: |
          python3 - <<'PACKET'
          import base64,hashlib,json,os,pathlib,zlib
          compressed=base64.b64decode(pathlib.Path(os.environ['RUNNER_TEMP'],'review65-packet.b64').read_bytes())
          assert hashlib.sha256(compressed).hexdigest()=='580303b5928f37134d181ebfc1336a2cd0db2503dba3eab891c667fd2f2df447'
          payload=zlib.decompress(compressed)
          assert hashlib.sha256(payload).hexdigest()=='3884dc21347468c73f49c64b96c4f4f32ee91df1e02dfc3431561304f206275d'
          files=json.loads(payload)
          assert set(files)==set(['assess.mjs', 'guard.mjs', 'manifest.json', 'rejected-recovery.test.tsx', 'source-files/src/__tests__/useForm/resetField.async.test.tsx', 'source-files/src/__tests__/useForm/resetField.asyncOwnership.test.tsx', 'source-files/src/logic/createFormControl.ts', 'source-files/src/logic/validateField.ts', 'source-files/src/useFieldArray.ts'])
          root=pathlib.Path('packet')
          for name,data in files.items():
              destination=root/name
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(base64.b64decode(data))
          print('SEALED_REVIEW65_PACKET=PASS; files='+str(len(files)))
          PACKET
      - name: Check out entire pinned official project
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: react-hook-form/react-hook-form
          ref: 6864846a29076d83d9d15c0925d0e71d9046d020
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Guard HEAD tree index all tracked bytes and declared candidate probe
        working-directory: upstream
        run: |
          node ../packet/guard.mjs before ${{ matrix.mode }} "$RUNNER_TEMP/review65"
          node --version
          pnpm --version
      - name: Install official dependencies from unchanged frozen lockfile
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Run unchanged reviewer four cases and print all raw evidence before assessment
        working-directory: upstream
        run: |
          set +e
          pnpm test --ci --runInBand --runTestsByPath src/__tests__/useForm/state42-rejected-recovery.test.tsx --json --outputFile="$RUNNER_TEMP/review65/jest-results.json" > "$RUNNER_TEMP/review65/native.log" 2>&1
          result=$?
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/review65/test-exit.txt"
          cat "$RUNNER_TEMP/review65/native.log"
          cat "$RUNNER_TEMP/review65/jest-results.json"
          cat "$RUNNER_TEMP/review65/test-exit.txt"
          python3 - <<'EVIDENCE'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'],'review65')
          marker='STATE42_REJECTION_RECOVERY_RECEIPT '
          receipts=[]
          for line in (root/'native.log').read_text().splitlines():
              if marker in line:
                  value=line.split(marker,1)[1].strip()
                  if value.startswith('{'): receipts.append(json.loads(value))
          (root/'receipts.json').write_text(json.dumps(receipts,indent=2)+'\n')
          result=json.loads((root/'jest-results.json').read_text())
          status={key:result.get(key) for key in ['success','numTotalTests','numPassedTests','numFailedTests','numRuntimeErrorTestSuites','numPendingTests','numTodoTests','openHandles']}
          status['exitCode']=int((root/'test-exit.txt').read_text())
          status['tests']=[{'title':test['title'],'status':test['status']} for suite in result['testResults'] for test in suite['assertionResults']]
          (root/'native-status.json').write_text(json.dumps(status,indent=2)+'\n')
          EVIDENCE
          cat "$RUNNER_TEMP/review65/receipts.json"
          cat "$RUNNER_TEMP/review65/native-status.json"
          node ../packet/assess.mjs "$RUNNER_TEMP/review65" ${{ matrix.mode }}
      - name: Guard exact tracked working tree index HEAD and probe after native execution
        if: always()
        working-directory: upstream
        run: node ../packet/guard.mjs after ${{ matrix.mode }} "$RUNNER_TEMP/review65"
      - name: Preserve complete raw results status receipts and source guards
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: state42-review65-rejected-recovery-${{ matrix.mode }}
          path: ${{ runner.temp }}/review65
          if-no-files-found: error
